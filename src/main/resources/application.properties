# 访问网关配置（前缀 gateway.）
# 下列值均为代码内默认值，这里显式列出便于本地调整；删除任一行即回落到默认值。

# 令牌签发方 / 受众
gateway.issuer=access-gateway
gateway.audience=gateway-clients

# 令牌与时钟
gateway.access-token-ttl=15m
gateway.refresh-token-ttl=12h
gateway.clock-skew-tolerance=60s
gateway.key-overlap-period=30m

# 会话族续期上限
# 自会话建立起的总最长可续期时间；连续轮换也不能超过该上限
gateway.session-max-lifetime=7d
# 距上一次刷新活动超过该时长即闲置超时，不能再换新令牌
gateway.session-idle-timeout=8h

# 内存审计日志容量上限，达到后按最旧优先淘汰
gateway.audit.max-entries=1000
