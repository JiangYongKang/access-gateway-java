# ===== 访问鉴权网关本地演示配置 =====
# 服务端口
server.port=8080

# 签发方标识（令牌 iss）
gateway.issuer=local-access-gateway
# 默认受众（aud）
gateway.default-audience=demo-api
# 访问令牌有效期（秒）
gateway.token.access-ttl-seconds=300
# 刷新令牌有效期（秒）
gateway.token.refresh-ttl-seconds=3600
# 客户端与服务端时钟偏差容忍（秒，闭区间边界）
gateway.token.clock-skew-seconds=30
# 旧密钥轮换后的重叠接受期（秒）
gateway.key.overlap-seconds=600
# 本地模拟主密钥种子（仅进程内派生 HMAC 密钥，非真实凭据）
gateway.key.seed=local-demo-master-secret-do-not-use-in-prod
